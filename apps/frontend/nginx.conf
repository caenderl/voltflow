# WebSocket upgrade map for the freqtrade vhost below. conf.d/*.conf is included
# inside nginx's http block, so `map` is legal here. It has to be a map rather
# than a hardcoded `Connection: upgrade` (as the socket.io location uses): the
# freqtrade vhost proxies *all* traffic through one location, and sending an
# upgrade header on plain GETs breaks keepalive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Plain HTTP: redirect everything to HTTPS
server {
    listen 8080;
    server_name _;
    return 301 https://$host$request_uri;
}

# voltflow itself. Explicitly the default_server now that a second vhost shares
# this port: anything that is not freqtrade.local lands here.
server {
    listen 8443 ssl default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # mkcert-issued cert for the local network (see certs/README or CLAUDE.md)
    ssl_certificate /etc/nginx/certs/voltflow.crt;
    ssl_certificate_key /etc/nginx/certs/voltflow.key;

    # Docker-internal DNS: resolve the upstream dynamically so that a backend
    # restart/redeploy (new container IP) does not cause a permanent 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Forward the REST API to the backend
    location /api/ {
        set $backend backend;
        proxy_pass http://$backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket (socket.io) to the backend - with upgrade headers
    location /socket.io/ {
        set $backend backend;
        proxy_pass http://$backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Service worker control files must never be long-cached, otherwise
    # clients get stuck on an old version and never see updates.
    location ~* ^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
        try_files $uri =404;
    }

    # Web app manifest: correct MIME type, allow short-lived caching.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Angular SPA: all remaining routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Freqtrade lives in its own compose bundle (~/freqtrade, see freqtrade-deploy)
# and publishes no host port; this vhost is its only way in. Name-based rather
# than path-based on purpose: FreqUI is an SPA that references its assets and its
# /api/v1/ endpoints from the root, and /api/ here is already voltflow's backend,
# so a /freqtrade/ subpath would collide on both counts.
#
# Requires: freqtrade.local resolving to this host, and the mkcert cert reissued
# with freqtrade.local in its SANs (the old one only covers voltflow.local).
server {
    listen 8443 ssl;
    server_name freqtrade.local;

    ssl_certificate /etc/nginx/certs/voltflow.crt;
    ssl_certificate_key /etc/nginx/certs/voltflow.key;

    # Same reason as above: resolve the upstream per request so a freqtrade
    # redeploy (new container IP) does not leave nginx on a permanent 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $freqtrade freqtrade;
        proxy_pass http://$freqtrade:8080;
        # HTTP/1.1 upstream, required for both websockets and keepalive.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # FreqUI holds a message websocket open across idle candles.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

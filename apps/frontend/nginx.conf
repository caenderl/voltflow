# Serves the built Angular SPA and reverse-proxies API/websocket traffic to
# the backend. Plain HTTP only, on the unprivileged default port 8080: TLS
# termination and the LAN-facing hostname routing live one layer up, in the
# shared ingress (see https://github.com/caenderl/ingress-deploy) that also
# fronts freqtrade on this host. That ingress reaches this container by the
# `voltflow` alias on the `edge` network (see docker-compose.prod.yml).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker-internal DNS: resolve the upstream dynamically so that a backend
    # restart/redeploy (new container IP) does not cause a permanent 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Forward the REST API to the backend
    location /api/ {
        set $backend backend;
        proxy_pass http://$backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket (socket.io) to the backend - with upgrade headers
    location /socket.io/ {
        set $backend backend;
        proxy_pass http://$backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Service worker control files must never be long-cached, otherwise
    # clients get stuck on an old version and never see updates.
    location ~* ^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
        try_files $uri =404;
    }

    # Web app manifest: correct MIME type, allow short-lived caching.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Angular SPA: all remaining routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

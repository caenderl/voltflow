<div class="metric-grid">
  <!-- CPU load -->
  <app-metric-tile label="CPU-Last" [value]="loadValue()" [color]="loadColor()" [sub]="loadSub()">
    <div echarts [options]="loadChart()" class="metric-spark"></div>
  </app-metric-tile>

  <!-- Memory -->
  <app-metric-tile label="Arbeitsspeicher" [value]="memValue()" [color]="memColor()" [sub]="memSub()">
    <div echarts [options]="memChart()" class="metric-spark"></div>
  </app-metric-tile>

  <!-- Disk (near-static: a usage bar reads clearer than a sparkline) -->
  <app-metric-tile label="Festplatte" [value]="diskValue()" [color]="diskColor()" [sub]="diskSub()">
    <div class="disk-bar" role="img" [attr.aria-label]="'Belegung ' + diskValue()">
      @if (hasDisk()) {
        <span class="disk-fill" [style.width.%]="diskPct()" [style.background]="diskColor()"></span>
      }
    </div>
  </app-metric-tile>
</div>

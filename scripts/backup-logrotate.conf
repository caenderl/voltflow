# logrotate config for the backup/maintenance logs written by the cron jobs.
# Server-side only (paths are absolute); driven by the weekly crontab entry:
#   0 4 * * 0 /usr/sbin/logrotate --state ~/voltflow/scripts/logrotate.state \
#               ~/voltflow/scripts/backup-logrotate.conf
#
# copytruncate: the cron jobs append with `>>` and hold the fd open, so the file
# is truncated in place rather than renamed out from under a running job.
/home/chris/voltflow/backups/backup.log
/home/chris/voltflow/backups/backup-offsite.log
/home/chris/voltflow/backups/prune.log {
    weekly
    rotate 6
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
